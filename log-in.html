<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=dvice-width,initial-scale=1.0">
        <title>Zoo website Log in</title>
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
         <header>
            <h1 id="title">WildPath Zoo</h1>
            <nav class="navigation">
                <a href="#buy-tickets">Buy Ticket</a>
                <a href="./log-in.html">Sign up</a>
            </nav>
        </header>
    
        <form class="log-in">
            <div class="sign-in">
              <h2>Sign-in Form</h2>
              <p class="green"><span aria-hidden="true">*</span>All fields are required to sign-in</p>
              <label for="first-name">First Name:</label>
              <input id="first-name" name="first-name" type="text" required>
              <label for="last-name">Last Name:</label>
              <input id="last-name" name="last-name" type="text" required>
              <label for="mail">Email:</label>
              <input type="email" id="mail" name="mail" required>
              <button type="submit" id="sign-in">Sign-in</button>
              <p>Don't have an accout <span class="green">Create Account</span></p>
            </div>
            <div class="sign-up">
              <h2>Sign-up Form</h2>
              <p class="green"><span aria-hidden="true">*</span> All fields are required to sign-up</p>
              <label for="first-name">First Name:</label>
              <input id="first-name" name="first-name" type="text" required>
              <label for="last-name">Last Name:</label>
              <input id="last-name" name="last-name" type="text" required>
              <label for="mail">Email:</label>
              <input type="email" id="mail" name="mail" required>
              <button type="submit" id="sign-up">Sign-up</button>
              <p >Already have an accout <span class="green">Sign-in</span></p>
            </div>
        </form>
        <script src="./script.js"></script>

    </body>
</html>
